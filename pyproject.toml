[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeryn-core-agent"
version = "62.1"
description = "Aeryn Personal AI OS — self-reporting agent framework (Termux native + AlmaLinux worker)"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
aeryn = "aeryn_core.cli:main"

[project.optional-dependencies]
api = ["fastapi>=0.109.0", "uvicorn>=0.27.0", "pydantic>=2.0.0"]
ml = ["numpy>=1.22.0", "sentence-transformers>=2.2.0"]
dev = ["pytest>=7.0.0", "ruff", "mypy"]

[tool.setuptools.packages.find]
include = ["aeryn_core*"]
exclude = ["tests*", "apps*", "Personalisasi*", "aeryn_core._archive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-x -q --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E500"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = false
