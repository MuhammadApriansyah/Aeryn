[project]
name = "aeryn-core-agent"
version = "61.0"
description = "Aeryn Personal Assistant AI Agent — Full-stack adaptive AI platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-x -q --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E500"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = false
