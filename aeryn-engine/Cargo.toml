[workspace]
resolver = "2"
members = [
    "crates/aeryn-core",
    "crates/aeryn-vector",
    "crates/aeryn-splitter",
    "crates/aeryn-tokenizer",
    "crates/aeryn-db",
    "crates/aeryn-embed",
    "crates/aeryn-processor",
    "crates/aeryn-mcp",
    "crates/aeryn-graph",
    "crates/aeryn-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Aeryn Team"]

[workspace.dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
rayon = "1.10"
parking_lot = "0.12"
hashbrown = "0.14"
rand = "0.8"
memmap2 = "0.9"
bincode = "1.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
unicode-segmentation = "1.10"
lazy_static = "1.5"
once_cell = "1.19"
dashmap = "6"
crossbeam = "0.8"
bytes = "1"
flate2 = "1"
sha2 = "0.10"
base64 = "0.22"
itertools = "0.13"
smallvec = "1.13"
half = "2"
ndarray = "0.16"
rusqlite = { version = "0.32", features = ["bundled"] }
deadpool = "0.10"
async-trait = "0.1"
url = "2.5"
httparse = "1.9"
jsonwebtoken = "9"
argon2 = "0.5"
zstd = "0.13"
lru = "0.12"
moka = { version = "0.12", features = ["sync"] }
metrics = "0.23"
criterion = "0.5"
proptest = "1"
tempfile = "3"
equivalent = "1"
indexmap = "2"
compact_str = "0.8"
stringzilla = "3"
simdutf8 = "0.1"
memchr = "2"
aho-corasick = "1"
num_cpus = "1"
hex = "0.4"
