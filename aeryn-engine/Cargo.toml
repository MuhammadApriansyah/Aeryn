[package]
name = "aeryn-engine"
version = "0.1.0"
edition = "2021"
authors = ["Aeryn Team"]
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
regex = "1"
unicode-segmentation = "1"
sha2 = "0.10"
base64 = "0.22"
zstd = "0.13"
bincode = "1.3"
lru = "0.12"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
pyo3 = { version = "0.22", features = ["extension-module"] }
hex = "0.4"

[lib]
name = "aeryn_engine"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "aeryn-test"
path = "src/main.rs"
