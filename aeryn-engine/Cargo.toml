[package]
name = "aeryn-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "aeryn_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
tokio = { version = "1.35", features = ["full"] }
crossbeam-channel = "0.5.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
dashmap = "5.5"
regex = "1.10"
notify = "6.1"
