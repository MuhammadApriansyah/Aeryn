<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aeryn — Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/chat.css">
</head>
<body>
  <div class="chat-layout">
    <!-- Sidebar -->
    <aside class="chat-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <span>✦</span>
          <span>Aeryn</span>
        </div>
        <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>
      </div>
      <div class="sessions-list" id="sessionsList">
        <!-- Sessions loaded dynamically -->
      </div>
    </aside>

    <!-- Main Chat -->
    <main class="chat-main">
      <header class="chat-header">
        <div class="chat-title" id="chatTitle">New Conversation</div>
        <div class="chat-status">
          <span class="status-dot"></span>
          <span>Online</span>
        </div>
      </header>

      <!-- Messages -->
      <div class="chat-messages" id="chatMessages">
        <div class="chat-empty" id="chatEmpty">
          <h2>✦ Aeryn</h2>
          <p>Your AI assistant. Ask me anything, run commands, search the web, or manage files.</p>
        </div>
      </div>

      <!-- Input -->
      <div class="chat-input-area">
        <div class="chat-input-wrapper">
          <textarea class="chat-input" id="chatInput" placeholder="Send a message... (Enter to send, Shift+Enter for new line)" rows="1"></textarea>
          <button class="chat-send-btn" id="sendBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- Settings Overlay -->
  <div class="settings-overlay" id="settingsOverlay"></div>

  <!-- Settings Panel -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-header">
      <div class="settings-title">Settings</div>
      <button class="settings-close" id="settingsClose">✕</button>
    </div>

    <div class="settings-group">
      <label class="settings-label">Provider</label>
      <select class="settings-select" id="providerSelect">
        <option value="gemini">Google Gemini</option>
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic</option>
        <option value="deepseek">DeepSeek</option>
      </select>
    </div>

    <div class="settings-group">
      <label class="settings-label">Model</label>
      <select class="settings-select" id="modelSelect">
        <option value="auto">Auto</option>
        <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite</option>
        <option value="gpt-4o">GPT-4o</option>
        <option value="claude-sonnet-4">Claude Sonnet 4</option>
        <option value="deepseek-chat">DeepSeek Chat</option>
      </select>
    </div>

    <div class="settings-group">
      <label class="settings-label">System Prompt</label>
      <textarea class="settings-input" id="systemPromptInput" rows="4">You are Aeryn, a helpful AI assistant.</textarea>
    </div>

    <div class="settings-group">
      <label class="settings-label">Tools</label>
      <label><input type="checkbox" checked> Bash (run commands)</label><br>
      <label><input type="checkbox" checked> File Read</label><br>
      <label><input type="checkbox" checked> File Write</label><br>
      <label><input type="checkbox" checked> File Search</label><br>
      <label><input type="checkbox" checked> Web Search</label>
    </div>
  </div>

  <script src="/static/js/chat.js"></script>
</body>
</html>
