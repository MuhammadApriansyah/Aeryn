<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Aeryn Dashboard</title>
  <meta name="description" content="Aeryn AI Personal Assistant — Single Page Dashboard"/>
  <link rel="stylesheet" href="/web/static/css/dashboard.css"/>
</head>
<body data-theme="dark">
  <header class="top-nav">
    <div class="logo">Aeryn</div>
    <input type="text" id="search-input" class="search-input" placeholder="Search... (Ctrl+K)"/>
    <div class="top-actions">
      <button class="btn-icon" id="theme-toggle" onclick="window.AerynApp.toggleTheme()" title="Toggle Theme (Ctrl+T)">🌙</button>
      <button class="btn-icon" onclick="window.AerynApp.toggleCommandPalette()" title="Command Palette (Ctrl+Shift+P)">⌘</button>
      <button class="btn-icon" onclick="window.AerynApp.markAllRead()" title="Notifications">
        🔔<span id="notification-badge" class="badge">0</span>
      </button>
    </div>
  </header>

  <main class="dashboard-single" id="dashboard-content">
    <section id="health-stats"></section>
    <section id="quick-actions"></section>
    <section id="section-projects"></section>
    <section id="section-workspaces"></section>
    <section id="section-plugins"></section>
    <section id="section-audit"></section>
    <section id="section-notifications"></section>
    <section id="section-settings"></section>
  </main>

  <div id="toast-container" class="toast-container"></div>
  <script src="/web/static/js/dashboard.js"></script>
</body>
</html>
