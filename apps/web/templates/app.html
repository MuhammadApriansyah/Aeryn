<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aeryn — Agent Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <!-- ======= APP SHELL ======= -->
  <div class="app-shell">

    <!-- Floating Navbar -->
    <nav class="floating-nav" id="floatingNav" role="navigation" aria-label="Aeryn modules">
      <div class="nav-brand">
        <span class="nav-brand-mark">✦</span>
        <span class="nav-brand-name">Aeryn</span>
      </div>

      <div class="nav-links" id="navLinks">
        <button class="nav-link active" data-target="chat" data-modal-size="full">
          <span class="nav-icon">💬</span><span>Chat</span>
        </button>
        <button class="nav-link" data-target="memory" data-modal-size="large">
          <span class="nav-icon">🧠</span><span>Memory</span>
        </button>
        <button class="nav-link" data-target="tools" data-modal-size="large">
          <span class="nav-icon">🔧</span><span>Tools</span>
        </button>
        <button class="nav-link" data-target="agents" data-modal-size="large">
          <span class="nav-icon">🤖</span><span>Agents</span>
        </button>
        <button class="nav-link" data-target="safety" data-modal-size="medium">
          <span class="nav-icon">🛡</span><span>Safety</span>
        </button>
        <button class="nav-link" data-target="trace" data-modal-size="medium">
          <span class="nav-icon">📈</span><span>Trace</span>
        </button>
        <button class="nav-link" data-target="eval" data-modal-size="medium">
          <span class="nav-icon">🏆</span><span>Eval</span>
        </button>
        <button class="nav-link" data-target="plugins" data-modal-size="medium">
          <span class="nav-icon">🧩</span><span>Plugins</span>
        </button>
      </div>

      <div class="nav-actions">
        <button class="nav-action" id="settingsBtn" data-target="settings" data-modal-size="small" aria-label="Settings">⚙</button>
        <button class="nav-action" id="commandBtn" aria-label="Command palette">⌘K</button>
      </div>
    </nav>

    <!-- Main content area -->
    <main class="app-content" id="appContent">
      <!-- Chat di-load sebagai default view (full app P1-P7 via iframe) -->
      <section class="view-panel active" id="view-chat" data-view="chat">
        <iframe class="chat-iframe" src="/chat" title="Aeryn Chat"></iframe>
      </section>
    </main>

    <!-- Modal container (adaptif) -->
    <div class="modal-root" id="modalRoot">
      <div class="modal-backdrop" id="modalBackdrop"></div>
      <div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal-header">
          <div class="modal-title" id="modalTitle">Module</div>
          <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
        </div>
        <div class="modal-body" id="modalBody">
          <div class="modal-loading">Memuat…</div>
        </div>
      </div>
    </div>

    <!-- Toast container -->
    <div class="toast-root" id="toastRoot" aria-live="polite"></div>

    <!-- Command palette -->
    <div class="palette-root" id="paletteRoot" hidden>
      <div class="palette-backdrop" id="paletteBackdrop"></div>
      <div class="palette" role="dialog" aria-label="Command palette">
        <input class="palette-input" id="paletteInput" type="text" placeholder="Ketik untuk mencari modul / tool…" />
        <div class="palette-results" id="paletteResults"></div>
      </div>
    </div>

  </div>

  <!-- Vendor libraries (no build step) -->
  <script src="/static/vendor/gsap.min.js"></script>
  <script src="/static/vendor/three.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/static/vendor/marked.min.js"></script>

  <!-- App scripts (chat di-load via iframe terpisah, jadi tidak perlu chat.js di sini) -->
  <script src="/static/js/markdown.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/effects.js"></script>
</body>
</html>
