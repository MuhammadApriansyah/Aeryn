# Aeryn API — reverse proxy (multi-worker uvicorn backend)
#
# Backend: PM2 fork (1 entry) -> uvicorn workers=6 on port 3010.
# State (sessions/tasks/approvals/traces) shared via PostgreSQL.
#
# LETAKKAN di: /etc/nginx/sites-available/aeryn
# Lalu enable:  sudo ln -s /etc/nginx/sites-available/aeryn /etc/nginx/sites-enabled/aeryn
# Test config:  sudo nginx -t
# Reload:       sudo systemctl reload nginx  (atau sudo nginx -s reload)

upstream aeryn_backend {
    server 127.0.0.1:3010;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    # Health check (tanpa buffering)
    location = /health {
        proxy_pass http://aeryn_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    # Agent chat + async (mendukung SSE streaming)
    location / {
        proxy_pass http://aeryn_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        # Long-running agent (LLM bisa beberapa detik)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # SSE / streaming: matikan buffering supaya token stream real-time
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
    }
}