name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    env:
      PATH: /root/.cargo/bin:/usr/local/bin:/usr/bin:/bin
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system deps
        run: |
          sudo -S -p '' apt-get update
          sudo -S -p '' apt-get install -y build-essential pkg-config libssl-dev
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi uvicorn pydantic numpy discord.py maturin
      
      - name: Build aeryn-engine
        run: |
          cd aeryn-engine
          maturin build --release --interpreter python3.11
          pip install target/wheels/*.whl
          cd ..
      
      - name: Run tests
        run: |
          python -m pytest tests/ --tb=line -q --ignore=tests/load 2>&1 | tail -30
          
      - name: Security scan
        run: |
          VIOLATIONS=$(grep -rn 'shell=True' aeryn_core/ apps/api/ --include='*.py' | grep -v '^\s*#' | grep -v '# .*shell=True' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "ERROR: Found shell=True usage:"
            echo "$VIOLATIONS"
            exit 1
          else
            echo "Security OK - no actual shell=True usage"
          fi
