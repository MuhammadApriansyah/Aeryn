name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies and run tests
        run: |
          uv venv venv-proot
          source venv-proot/bin/activate
          uv pip install -r requirements.txt
          
          # Install Rust & build engine
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          cd aeryn-engine && maturin develop --release && cd ..
          
          # Run tests
          python -m pytest tests/ --tb=short --ignore=tests/load 2>&1
          
          # Security scan
          grep -rn 'shell=True' aeryn_core/ apps/api/ --include='*.py' && exit 1 || echo "Security OK"
