name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system deps
        run: |
          sudo -S -p '' apt-get update
          sudo -S -p '' apt-get install -y build-essential pkg-config libssl-dev
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi uvicorn pydantic numpy discord.py maturin
      
      - name: Build and install aeryn-engine
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd /home/runner/work/Aeryn/Aeryn/aeryn-engine
          maturin develop --release
      
      - name: Run tests
        run: |
          cd /home/runner/work/Aeryn/Aeryn
          python -m pytest tests/ --tb=short --ignore=tests/load
          
      - name: Security scan
        run: |
          cd /home/runner/work/Aeryn/Aeryn
          grep -rn 'shell=True' aeryn_core/ apps/api/ --include='*.py' && exit 1 || echo "Security OK"
