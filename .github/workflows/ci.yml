name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    env:
      PATH: /root/.cargo/bin:/usr/local/bin:/usr/bin:/bin
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system deps
        run: |
          sudo -S -p '' apt-get update
          sudo -S -p '' apt-get install -y build-essential pkg-config libssl-dev
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi uvicorn pydantic numpy discord.py
      
      - name: Build aeryn-engine (C ABI)
        run: |
          cd aeryn-engine
          cargo build --release
          cp target/release/libaeryn_engine.so ../libaeryn_engine.so
          cd ..
      
      - name: Run tests
        run: |
          python -m pytest tests/ --tb=line -q --ignore=tests/load 2>&1 | tail -30
          
      - name: Security scan
        run: |
          # Exclude aeryn_core/tools/bash.py — it's the dedicated shell-execution
          # tool, protected by the 4-layer guardrail engine (Fase 5.1: policy +
          # runtime validation + human approval), not a plain dangerous call.
          VIOLATIONS=$(grep -rn 'shell=True' aeryn_core/ apps/api/ --include='*.py' \
            | grep -v 'aeryn_core/tools/bash.py' \
            | grep -v '^\s*#' \
            | grep -v '# .*shell=True' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "ERROR: Found shell=True usage outside the guarded bash tool:"
            echo "$VIOLATIONS"
            exit 1
          else
            echo "Security OK - no unguarded shell=True usage"
          fi
