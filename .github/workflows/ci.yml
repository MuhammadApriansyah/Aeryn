name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "0.12.5"
    
    - name: Create venv
      run: |
        uv venv venv-proot
        source venv-proot/bin/activate
    
    - name: Install dependencies
      run: |
        source venv-proot/bin/activate
        uv pip install -r requirements.txt
    
    - name: Run tests
      run: |
        source venv-proot/bin/activate
        python -m pytest tests/ -v --tb=short
    
    - name: Security scan
      run: |
        source venv-proot/bin/activate
        grep -rn 'shell=True' aeryn_core/ apps/api/ --include='*.py' && exit 1 || echo "Security OK"
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test-results/
